name: Bootstrap model economy PR

on:
  schedule:
    - cron: "*/5 * * * *"
  push:
    branches:
      - main
  issue_comment:
    types:
      - created
  pull_request_target:
    types:
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: write

concurrency:
  group: labline-model-economy-bootstrap
  cancel-in-progress: false

jobs:
  publish-pr-branch:
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[run-model-economy-bootstrap]')) ||
      (github.event_name == 'issue_comment' && github.event.issue.number == 3 && github.event.comment.body == '/publish-model-economy') ||
      (github.event_name == 'pull_request_target' && github.event.pull_request.number == 3 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'balance/model-economy-recalibration')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out prepared PR branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: balance/model-economy-recalibration

      - name: Detect whether publication is still pending
        id: probe
        shell: bash
        run: |
          if [[ -f .github/labline-balance/apply_model_economy_delta.py && -f .github/workflows/labline-model-economy-publish.yml ]]; then
            echo "pending=true" >> "$GITHUB_OUTPUT"
          else
            echo "pending=false" >> "$GITHUB_OUTPUT"
            echo "The implementation branch is already clean; nothing to publish."
          fi

      - name: Set up Bun
        if: steps.probe.outputs.pending == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Reconstruct reviewed base patch
        if: steps.probe.outputs.pending == 'true'
        run: |
          cat .github/labline-balance/script.b64.* | base64 --decode > /tmp/apply_labline_balance_patch.py
          cat .github/labline-balance/plan.b64.* | base64 --decode > /tmp/IMPLEMENTATION_PLAN.md
          chmod +x /tmp/apply_labline_balance_patch.py

      - name: Verify exact patch anchors
        if: steps.probe.outputs.pending == 'true'
        run: python /tmp/apply_labline_balance_patch.py . --check --allow-newer

      - name: Apply company, training, specialist, and UI pass
        if: steps.probe.outputs.pending == 'true'
        run: python /tmp/apply_labline_balance_patch.py . --allow-newer

      - name: Apply inference, price-floor, rival, and calibration pass
        if: steps.probe.outputs.pending == 'true'
        run: python .github/labline-balance/apply_model_economy_delta.py .

      - name: Check patch whitespace
        if: steps.probe.outputs.pending == 'true'
        run: git diff --check

      - name: Install dependencies
        if: steps.probe.outputs.pending == 'true'
        run: bun install --frozen-lockfile

      - name: Run focused model-economy matrix
        if: steps.probe.outputs.pending == 'true'
        run: bun run test:balance:model-economy

      - name: Run full test suite
        if: steps.probe.outputs.pending == 'true'
        run: bun run test

      - name: Run lint
        if: steps.probe.outputs.pending == 'true'
        run: bun run lint

      - name: Build production bundle
        if: steps.probe.outputs.pending == 'true'
        run: bun run build

      - name: Remove publication-only staging files
        if: steps.probe.outputs.pending == 'true'
        run: |
          git rm -r .github/labline-balance
          git rm .github/workflows/labline-model-economy-publish.yml

      - name: Commit and publish validated implementation
        if: steps.probe.outputs.pending == 'true'
        env:
          BRANCH_NAME: balance/model-economy-recalibration
        run: |
          git config user.name "Labline Balance Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: rebalance model creation, inference, pricing, and rivals"
          git push origin "HEAD:${BRANCH_NAME}"
