name: Bootstrap model economy PR

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: labline-model-economy-bootstrap
  cancel-in-progress: false

jobs:
  publish-pr-branch:
    if: contains(github.event.head_commit.message, '[run-model-economy-bootstrap]')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out prepared PR branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: balance/model-economy-recalibration

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Reconstruct reviewed base patch
        run: |
          cat .github/labline-balance/script.b64.* | base64 --decode > /tmp/apply_labline_balance_patch.py
          cat .github/labline-balance/plan.b64.* | base64 --decode > /tmp/IMPLEMENTATION_PLAN.md
          chmod +x /tmp/apply_labline_balance_patch.py

      - name: Verify exact patch anchors
        run: python /tmp/apply_labline_balance_patch.py . --check --allow-newer

      - name: Apply company, training, specialist, and UI pass
        run: python /tmp/apply_labline_balance_patch.py . --allow-newer

      - name: Apply inference, price-floor, rival, and calibration pass
        run: python .github/labline-balance/apply_model_economy_delta.py .

      - name: Check patch whitespace
        run: git diff --check

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run focused model-economy matrix
        run: bun run test:balance:model-economy

      - name: Run full test suite
        run: bun run test

      - name: Run lint
        run: bun run lint

      - name: Build production bundle
        run: bun run build

      - name: Remove publication-only staging files
        run: |
          git rm -r .github/labline-balance
          git rm .github/workflows/labline-model-economy-publish.yml

      - name: Commit and publish validated implementation
        env:
          BRANCH_NAME: balance/model-economy-recalibration
        run: |
          git config user.name "Labline Balance Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: rebalance model creation, inference, pricing, and rivals"
          git push origin "HEAD:${BRANCH_NAME}"
